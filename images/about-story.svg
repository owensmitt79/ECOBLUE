<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#BAE6FD"/>
      <stop offset="85%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="truckCab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="70%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="metalChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.35" flood-color="#0A2540"/>
    </filter>
  </defs>

  <!-- Sky & Landscape -->
  <rect width="800" height="380" fill="url(#skyGrad)"/>
  
  <!-- Sun -->
  <circle cx="680" cy="110" r="54" fill="url(#sunGrad)" opacity="0.85"/>
  <circle cx="680" cy="110" r="75" fill="#FEF08A" opacity="0.25"/>

  <!-- City Skyline / Foliage Backdrop -->
  <path d="M0,320 L40,290 L90,320 L150,280 L220,325 L290,270 L350,320 L440,260 L520,320 L610,275 L700,320 L800,285 L800,380 L0,380 Z" fill="#93C5FD" opacity="0.35"/>
  <path d="M0,345 C120,330 240,355 360,335 C480,315 620,350 800,330 L800,390 L0,390 Z" fill="#047857" opacity="0.25"/>
  <path d="M-20,360 C150,340 320,365 500,345 C650,330 750,360 820,350 L820,400 L-20,400 Z" fill="#059669" opacity="0.5"/>

  <!-- Road & Sidewalk Curb -->
  <rect y="380" width="800" height="170" fill="url(#roadGrad)"/>
  <!-- Sidewalk -->
  <polygon points="0,380 800,380 800,400 0,400" fill="#CBD5E1"/>
  <polygon points="0,396 800,396 800,402 0,402" fill="#94A3B8"/>
  <!-- Curb markings -->
  <line x1="0" y1="400" x2="800" y2="400" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="0" y1="495" x2="800" y2="495" stroke="#FCD34D" stroke-width="4" stroke-dasharray="35 25"/>

  <!-- EcoBlue Hydraulic Compactor Truck (Hero Asset) -->
  <g id="truckGroup" filter="url(#dropShadow)">
    <!-- Truck Shadow -->
    <ellipse cx="400" cy="485" rx="310" ry="24" fill="#0A2540" opacity="0.45"/>

    <!-- COMPACTOR REAR HOPPER -->
    <path d="M140,240 L220,220 L220,440 L160,440 L130,410 L130,310 Z" fill="#064E3B"/>
    <polygon points="140,250 200,235 200,425 150,425 135,400" fill="#047857"/>
    <!-- Hydraulic arm accents -->
    <line x1="135" y1="280" x2="180" y2="350" stroke="url(#metalChrome)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="280" r="7" fill="#E2E8F0"/>
    <circle cx="180" cy="350" r="7" fill="#E2E8F0"/>

    <!-- MAIN COMPACTOR BODY TANK -->
    <rect x="215" y="210" width="280" height="230" rx="16" fill="url(#truckBody)"/>
    <!-- Body Highlights & Ribs -->
    <line x1="260" y1="220" x2="260" y2="430" stroke="#047857" stroke-width="4"/>
    <line x1="330" y1="220" x2="330" y2="430" stroke="#047857" stroke-width="4"/>
    <line x1="400" y1="220" x2="400" y2="430" stroke="#047857" stroke-width="4"/>
    <line x1="470" y1="220" x2="470" y2="430" stroke="#047857" stroke-width="4"/>

    <!-- EcoBlue Brand Plate on Truck -->
    <rect x="250" y="275" width="210" height="85" rx="12" fill="#0A2540" stroke="#10B981" stroke-width="3"/>
    <text x="355" y="325" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">Eco<tspan fill="#34D399">Blue</tspan></text>
    <text x="355" y="348" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2.5" text-anchor="middle">ENVIRONMENTAL SERVICES</text>

    <!-- Eco Leaf Crest -->
    <circle cx="280" cy="320" r="16" fill="#059669"/>
    <path d="M280,310 C288,310 292,317 288,326 C284,330 274,328 273,322 C273,316 276,310 280,310 Z" fill="#ffffff"/>

    <!-- CABIN (HEAVY DUTY COMPACTOR) -->
    <path d="M495,250 L560,250 L615,310 L645,360 L645,440 L495,440 Z" fill="url(#truckCab)"/>
    <!-- Windshield & Side Windows -->
    <polygon points="560,260 605,315 570,315 560,260" fill="url(#glassGrad)"/>
    <polygon points="505,260 550,260 550,320 505,320" fill="url(#glassGrad)"/>
    <line x1="550" y1="260" x2="550" y2="320" stroke="#0A2540" stroke-width="4"/>

    <!-- Headlights & Chrome Grille -->
    <rect x="620" y="390" width="26" height="35" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="633" cy="407" r="8" fill="#FEF08A"/>
    <polygon points="615,410 645,410 640,435 615,435" fill="#334155"/>
    <line x1="617" y1="418" x2="643" y2="418" stroke="url(#metalChrome)" stroke-width="2"/>
    <line x1="617" y1="426" x2="641" y2="426" stroke="url(#metalChrome)" stroke-width="2"/>

    <!-- Cab door handle & steps -->
    <rect x="525" y="340" width="22" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="510" y="425" width="45" height="8" rx="2" fill="#94A3B8"/>

    <!-- CHASSIS, BUMPER & WHEELS -->
    <rect x="180" y="430" width="450" height="25" fill="#1E293B"/>

    <!-- Front Wheel -->
    <g transform="translate(565, 455)">
      <circle cx="0" cy="0" r="42" fill="#0F172A"/>
      <circle cx="0" cy="0" r="32" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="url(#metalChrome)"/>
      <circle cx="0" cy="0" r="10" fill="#0F172A"/>
      <circle cx="0" cy="0" r="4" fill="#E2E8F0"/>
    </g>

    <!-- Rear Wheel Assembly (Dual Axles) -->
    <g transform="translate(325, 455)">
      <circle cx="0" cy="0" r="42" fill="#0F172A"/>
      <circle cx="0" cy="0" r="32" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="url(#metalChrome)"/>
      <circle cx="0" cy="0" r="10" fill="#0F172A"/>
    </g>
    <g transform="translate(230, 455)">
      <circle cx="0" cy="0" r="42" fill="#0F172A"/>
      <circle cx="0" cy="0" r="32" fill="#334155"/>
      <circle cx="0" cy="0" r="24" fill="url(#metalChrome)"/>
      <circle cx="0" cy="0" r="10" fill="#0F172A"/>
    </g>
  </g>

  <!-- Clean Urban Waste Bins (Foreground Detail) -->
  <g transform="translate(680, 400)" filter="url(#dropShadow)">
    <rect x="0" y="20" width="55" height="75" rx="8" fill="#059669"/>
    <polygon points="-4,20 59,20 52,10 3,10" fill="#047857"/>
    <circle cx="15" cy="55" r="10" fill="#ffffff" opacity="0.2"/>
    <!-- Recycle Symbol on Bin -->
    <path d="M28,45 L34,55 L22,55 Z" fill="#ffffff"/>
    <text x="28" y="80" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">ORGANIC</text>
  </g>

  <g transform="translate(745, 400)" filter="url(#dropShadow)">
    <rect x="0" y="20" width="55" height="75" rx="8" fill="#0284C7"/>
    <polygon points="-4,20 59,20 52,10 3,10" fill="#0369A1"/>
    <!-- Recycle Symbol on Bin -->
    <path d="M28,45 L34,55 L22,55 Z" fill="#ffffff"/>
    <text x="28" y="80" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">RECYCLE</text>
  </g>

  <!-- Floating Badge Watermark -->
  <g transform="translate(40, 40)">
    <rect width="210" height="42" rx="21" fill="rgba(255,255,255,0.9)" stroke="rgba(10,37,64,0.15)" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="9" fill="#059669"/>
    <text x="42" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#0A2540" letter-spacing="0.5">FLEET &amp; OPERATIONS</text>
  </g>
</svg>
